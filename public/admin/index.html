<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Catalogue Admin</title>

  <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <span>Imaginary Gifts</span>
    <small>Catalogue Admin</small>
  </div>

  <button id="logoutBtn" class="logout-btn hidden">
    Logout
  </button>
</header>


<!-- ================= LOGIN ================= -->

<main id="loginPage" class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      IG
    </div>

    <h1 id="authTitle">Admin Login</h1>

    <p id="authSubtitle">
      Login to manage your products
    </p>


    <!-- LOGIN FORM -->

    <div id="loginForm">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginBtn" class="primary-btn">
        Login
      </button>

      <button id="showRegisterBtn" class="link-btn">
        New User
      </button>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- NEW USER FORM -->

    <div id="registerForm" class="hidden">

      <input
        id="registerEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
      >

      <input
        id="registerPassword2"
        type="password"
        placeholder="Confirm Password"
        autocomplete="new-password"
      >

      <button id="registerBtn" class="primary-btn">
        Create User
      </button>

      <button id="showLoginBtn" class="link-btn">
        Back to Login
      </button>

      <div id="registerMessage" class="message"></div>

    </div>

  </div>

</main>


<!-- ================= ADMIN ================= -->

<main id="adminPage" class="admin-page hidden">


  <!-- PRODUCT FORM -->

  <section class="admin-card">

    <div class="section-title">
      <div>
        <h2 id="productFormTitle">Add Product</h2>
        <p>Create or edit your product</p>
      </div>
    </div>


    <input id="productId" type="hidden">


    <!-- PRODUCT NAME -->

    <label>
      Product Name
    </label>

    <input
      id="productName"
      type="text"
      placeholder="Example: Personalized Name Plate"
    >


    <!-- BASE PRICE -->

    <label>
      Price
    </label>

    <input
      id="productPrice"
      type="number"
      min="0"
      step="0.01"
      placeholder="499"
    >


    <!-- COLOURS -->

    <div class="field-header">

      <h3>Colours</h3>

      <button id="addColourBtn" class="small-btn">
        + Add Colour
      </button>

    </div>

    <div id="colourList"></div>


    <!-- SIZES -->

    <div class="field-header">

      <h3>Sizes</h3>

      <button id="addSizeBtn" class="small-btn">
        + Add Size
      </button>

    </div>

    <div id="sizeList"></div>


    <!-- IMAGES -->

    <div class="field-header">

      <h3>Product Images</h3>

    </div>

    <input
      id="productImages"
      type="file"
      accept="image/*"
      multiple
    >

    <div id="imagePreview" class="image-preview"></div>


    <!-- SHOW FRONTEND -->

    <label class="checkbox-row">

      <input
        id="productActive"
        type="checkbox"
        checked
      >

      <span>
        Show on Frontend
      </span>

    </label>


    <!-- SAVE -->

    <div class="form-buttons">

      <button id="saveProductBtn" class="primary-btn">
        Save Product
      </button>

      <button id="cancelEditBtn" class="secondary-btn hidden">
        Cancel Edit
      </button>

    </div>

    <div id="productMessage" class="message"></div>

  </section>


  <!-- ALL PRODUCTS -->

  <section class="admin-card">

    <div class="section-title">

      <div>
        <h2>All Products</h2>
        <p>Manage your products</p>
      </div>

      <button id="refreshProductsBtn" class="small-btn">
        Refresh
      </button>

    </div>


    <div id="productsList" class="products-list">

      <div class="loading">
        Loading products...
      </div>

    </div>

  </section>

</main>


<script src="/admin/admin.js"></script>

</body>
</html>
