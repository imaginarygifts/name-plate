<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders - Imaginary Gifts</title>

    <link
        rel="stylesheet"
        href="/admin/orders.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
====================================================== -->

<header class="orders-header">

    <div class="header-left">

        <button
            type="button"
            id="backButton"
            class="icon-button"
        >
            ←
        </button>


        <div>

            <h1>
                Orders
            </h1>

            <p id="orderCount">
                Loading orders...
            </p>

        </div>

    </div>


    <button
        type="button"
        id="refreshButton"
        class="secondary-button"
    >
        ↻ Refresh
    </button>

</header>



<main class="orders-page">


    <!-- =================================================
         FILTERS + BULK MANAGEMENT
    ================================================== -->

    <section class="control-card">


        <div class="control-title">

            <div>

                <h2>
                    Order Management
                </h2>

                <p>
                    Manage orders and payments
                </p>

            </div>

        </div>



        <!-- =============================================
             FILTERS
        ============================================== -->

        <div class="filter-grid">


            <div class="filter-field">

                <label for="orderFilter">
                    Order Status
                </label>


                <select id="orderFilter">

                    <option value="">
                        All Orders
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="confirmed">
                        Confirmed
                    </option>

                    <option value="in_progress">
                        In Progress
                    </option>

                    <option value="complete">
                        Complete
                    </option>

                    <option value="delivered">
                        Delivered
                    </option>

                    <option value="cancelled">
                        Cancelled
                    </option>

                </select>

            </div>



            <div class="filter-field">

                <label for="paymentFilter">
                    Payment Status
                </label>


                <select id="paymentFilter">

                    <option value="">
                        All Payments
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="paid">
                        Paid
                    </option>

                    <option value="refund">
                        Refund
                    </option>

                </select>

            </div>


        </div>



        <!-- =============================================
             BULK CONTROLS
        ============================================== -->

        <div class="bulk-section">


            <div class="bulk-row">


                <label class="select-all-label">

                    <input
                        type="checkbox"
                        id="selectAll"
                    >

                    <span>
                        Select All
                    </span>

                </label>


                <span
                    id="selectedCount"
                    class="selected-count"
                >
                    0 selected
                </span>


            </div>



            <div class="bulk-grid">


                <!-- ORDER STATUS -->

                <div class="bulk-field">

                    <select id="bulkOrderStatus">

                        <option value="">
                            Order Status
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                        <option value="confirmed">
                            Confirmed
                        </option>

                        <option value="in_progress">
                            In Progress
                        </option>

                        <option value="complete">
                            Complete
                        </option>

                        <option value="delivered">
                            Delivered
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                    </select>


                    <button
                        type="button"
                        id="applyOrderStatus"
                        class="gradient-button"
                    >
                        Apply
                    </button>

                </div>



                <!-- PAYMENT STATUS -->

                <div class="bulk-field">

                    <select id="bulkPaymentStatus">

                        <option value="">
                            Payment Status
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                        <option value="paid">
                            Paid
                        </option>

                        <option value="refund">
                            Refund
                        </option>

                    </select>


                    <button
                        type="button"
                        id="applyPaymentStatus"
                        class="gradient-button"
                    >
                        Apply
                    </button>

                </div>


            </div>

        </div>


    </section>



    <!-- =================================================
         ORDERS LIST
    ================================================== -->

    <section
        id="ordersList"
        class="orders-list"
    >

        <div class="loading-box">

            <div class="loader"></div>

            <p>
                Loading orders...
            </p>

        </div>

    </section>


</main>



<!-- =====================================================
     EDIT ORDER MODAL
====================================================== -->

<div
    id="editModal"
    class="modal hidden"
>


    <div class="modal-backdrop"></div>



    <div class="modal-box">


        <!-- =============================================
             MODAL HEADER
        ============================================== -->

        <div class="modal-header">


            <div>

                <h2>
                    Edit Order
                </h2>

                <p id="editOrderId">
                    Order
                </p>

            </div>


            <button
                type="button"
                id="closeEdit"
                class="modal-close"
            >
                ×
            </button>


        </div>



        <form id="editForm">


            <input
                type="hidden"
                id="editId"
            >



            <!-- =========================================
                 CUSTOMER DETAILS
            ========================================== -->

            <div class="edit-section">


                <h3>
                    Customer Details
                </h3>



                <div class="form-field">

                    <label for="editCustomerName">
                        Name
                    </label>

                    <input
                        id="editCustomerName"
                        type="text"
                        required
                    >

                </div>



                <div class="form-field">

                    <label for="editCustomerPhone">
                        Phone
                    </label>

                    <input
                        id="editCustomerPhone"
                        type="tel"
                        required
                    >

                </div>



                <div class="form-field">

                    <label for="editCustomerAddress">
                        Address
                    </label>

                    <textarea
                        id="editCustomerAddress"
                        rows="3"
                        required
                    ></textarea>

                </div>



                <div class="form-field">

                    <label for="editPincode">
                        Pincode
                    </label>

                    <input
                        id="editPincode"
                        type="text"
                        inputmode="numeric"
                        required
                    >

                </div>


            </div>



            <!-- =========================================
                 PRODUCT DETAILS
            ========================================== -->

            <div class="edit-section">


                <h3>
                    Product Details
                </h3>



                <!-- PRODUCT NAME -->

                <div class="form-field">

                    <label for="editProductName">
                        Product Name
                    </label>

                    <input
                        id="editProductName"
                        type="text"
                        required
                    >

                </div>



                <!-- =====================================
                     PRODUCT VARIANTS
                ====================================== -->

                <div class="form-field">


                    <label>
                        Product Variants
                    </label>


                    <div
                        id="editVariants"
                        class="edit-variants"
                    >

                        <!--
                            JavaScript dynamically creates
                            all variant dropdowns here.
                        -->

                        <div class="variant-edit-empty">

                            Loading variants...

                        </div>

                    </div>


                </div>



                <!-- FINAL PRICE -->

                <div class="form-field">

                    <label for="editFinalPrice">
                        Final Price
                    </label>

                    <input
                        id="editFinalPrice"
                        type="number"
                        min="0"
                        step="0.01"
                    >

                </div>


            </div>



            <!-- =========================================
                 STATUS
            ========================================== -->

            <div class="edit-section">


                <h3>
                    Status
                </h3>



                <!-- ORDER STATUS -->

                <div class="form-field">

                    <label for="editOrderStatus">
                        Order Status
                    </label>


                    <select
                        id="editOrderStatus"
                    >

                        <option value="pending">
                            Pending
                        </option>

                        <option value="confirmed">
                            Confirmed
                        </option>

                        <option value="in_progress">
                            In Progress
                        </option>

                        <option value="complete">
                            Complete
                        </option>

                        <option value="delivered">
                            Delivered
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>



                <!-- PAYMENT STATUS -->

                <div class="form-field">

                    <label for="editPaymentStatus">
                        Payment Status
                    </label>


                    <select
                        id="editPaymentStatus"
                    >

                        <option value="pending">
                            Pending
                        </option>

                        <option value="paid">
                            Paid
                        </option>

                        <option value="refund">
                            Refund
                        </option>

                    </select>

                </div>


            </div>



            <!-- =========================================
                 MODAL ACTIONS
            ========================================== -->

            <div class="modal-actions">


                <button
                    type="button"
                    id="cancelEdit"
                    class="secondary-button"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="gradient-button"
                >
                    Save Changes
                </button>


            </div>


        </form>


    </div>

</div>



<!-- =====================================================
     TOAST
====================================================== -->

<div
    id="toast"
    class="toast"
></div>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="/admin/orders.js"></script>


</body>
</html>
