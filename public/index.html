<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#09090b"
  >

  <title>Imaginary Gifts | Custom Name Plate</title>

  <link
    rel="stylesheet"
    href="/css/catalogue.css"
  >

</head>


<body>

  <!-- =====================================================
       STICKY TOP BAR
  ====================================================== -->

  <header class="topbar">

    <div class="topbar-inner">

      <a
        href="/"
        class="brand-link"
        aria-label="Imaginary Gifts"
      >

        <div class="brand-logo">
          IG
        </div>

        <div class="brand-text">
          <strong>Custom Name Plate</strong>
          <span>By Imaginary Gifts</span>
        </div>

      </a>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="catalogue">

    <!-- CATEGORY FILTER -->

    <section class="category-filter-section">

      <div
        id="categoryPills"
        class="category-pills"
      >

        <button
          type="button"
          class="category-pill active"
          data-category-id=""
        >
          All
        </button>

      </div>

    </section>


    <!-- PRODUCTS -->

    <section class="products-section">

      <div
        id="productsContainer"
        class="products-container"
      >

        <div class="loading-state">
          Loading products...
        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       ORDER MODAL
  ====================================================== -->

  <div
    id="orderModal"
    class="modal-overlay hidden"
  >

    <div class="order-modal">

      <div class="modal-header">

        <div>

          <h2>
            Place Order
          </h2>

          <p>
            Enter your delivery details.
          </p>

        </div>

        <button
          type="button"
          id="closeOrderModal"
          class="close-btn"
        >
          ×
        </button>

      </div>


      <!-- ORDER SUMMARY -->

      <div
        id="orderSummary"
        class="order-summary"
      >
      </div>


      <!-- ORDER FORM -->

      <form id="orderForm">

        <div class="form-field">

          <label for="customerName">
            Name
          </label>

          <input
            id="customerName"
            type="text"
            autocomplete="name"
            required
            placeholder="Your full name"
          >

        </div>


        <div class="form-field">

          <label for="customerPhone">
            Mobile Number
          </label>

          <input
            id="customerPhone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            required
            maxlength="10"
            placeholder="10 digit mobile number"
          >

        </div>


        <div class="form-field">

          <label for="customerAddress">
            Address
          </label>

          <textarea
            id="customerAddress"
            rows="3"
            autocomplete="street-address"
            required
            placeholder="Complete delivery address"
          ></textarea>

        </div>


        <div class="form-field">

          <label for="customerPincode">
            PIN Code
          </label>

          <input
            id="customerPincode"
            type="text"
            inputmode="numeric"
            autocomplete="postal-code"
            required
            maxlength="6"
            placeholder="6 digit PIN code"
          >

        </div>


        <div
          id="orderMessage"
          class="order-message"
        ></div>


        <button
          type="submit"
          class="submit-order-btn"
          id="submitOrderBtn"
        >
          Order on WhatsApp
        </button>

      </form>

    </div>

  </div>


  <!-- =====================================================
       STICKY ORDER BUTTON
  ====================================================== -->

  <div
    id="stickyOrderBar"
    class="sticky-order-bar hidden"
  >

    <div class="sticky-order-info">

      <strong
        id="stickyProductName"
      >
        Product
      </strong>

      <span
        id="stickyProductPrice"
      >
        ₹0
      </span>

    </div>


    <button
      type="button"
      id="stickyOrderBtn"
      class="sticky-order-btn"
    >
      Order
    </button>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script
    src="/js/catalogue.js"
    defer
  ></script>

</body>

</html>
